<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAWAF HQ — 3D Office V2</title><style>
:root{--bg:#05080d;--panel:#09111be8;--line:#d3a44a44;--gold:#d3a44a;--gold2:#f3d58e;--txt:#eef3f8;--mut:#8592a1;--ok:#45d79a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:var(--txt);font-family:Inter,Segoe UI,Tahoma,Arial,sans-serif}body{background:radial-gradient(circle at 50% 16%,#142238 0,#09111b 42%,#05080d 80%)}#scene{position:absolute;inset:0}.hud{position:absolute;inset:0;pointer-events:none;z-index:10}.top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;gap:10px}.glass{background:#09111be8;border:1px solid #ffffff10;backdrop-filter:blur(15px);box-shadow:0 18px 70px #0008}.brand{pointer-events:auto;padding:11px 14px;border-radius:16px;border-color:var(--line)}.brand b{color:var(--gold2);letter-spacing:.7px}.brand small{display:block;color:var(--mut);font-size:11px;margin-top:3px}.stats{display:flex;gap:8px}.stat{padding:9px 11px;border-radius:13px;min-width:96px}.stat strong{display:block;font-size:18px}.stat span{font-size:10px;color:var(--mut)}.toolbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:5px;border-radius:999px;pointer-events:auto}.toolbar button{padding:7px 11px;border-radius:999px;font-size:10px}.side{position:absolute;right:18px;top:96px;width:320px;padding:14px;border-radius:18px;border-color:var(--line);pointer-events:auto}.eyebrow{font-size:10px;color:var(--gold2);letter-spacing:.6px}.side h3{margin:5px 0 3px;font-size:18px}.role{font-size:11px;color:#aeb9c6}.status{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:6px 8px;border:1px solid #ffffff0d;border-radius:10px;background:#111a25;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 14px currentColor}.task{margin-top:11px;padding-top:10px;border-top:1px solid #ffffff0b;font-size:12px;line-height:1.7;color:#d5dee7}.progress{height:7px;border-radius:99px;background:#17202b;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#986821,#f0ce82);box-shadow:0 0 18px #d3a44a66}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{border:1px solid #ffffff12;background:#111a27;color:#edf3f8;border-radius:10px;padding:8px 9px;cursor:pointer;font-weight:650}button:hover{border-color:#d3a44a66;background:#182331}.primary{background:linear-gradient(180deg,#d6aa52,#a97b2a);color:#0b0d10;border-color:#f2d083}.hint{position:absolute;left:16px;bottom:16px;padding:9px 11px;border-radius:13px;color:var(--mut);font-size:10px}.toast{position:absolute;left:50%;top:78px;transform:translate(-50%,-8px);opacity:0;padding:8px 11px;border-radius:10px;font-size:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.label{position:absolute;transform:translate(-50%,-50%);pointer-events:none;padding:5px 8px;border-radius:9px;font-size:10px;color:#e6edf4;white-space:nowrap;background:#071019d9;border:1px solid #ffffff16;box-shadow:0 10px 30px #0008}.label.working{border-color:#45d79a55}.label.ready{border-color:#d3a44a55}@media(max-width:900px){.side{width:270px;right:8px;top:86px}.stats .stat:nth-child(n+2){display:none}.brand small{display:none}.toolbar{top:auto;bottom:14px}.hint{display:none}}
</style></head><body><div id="scene"></div><div class="hud"><div class="top"><div class="brand glass"><b>NAWAF HQ — LIVE 3D OFFICE V2</b><small>مقر تشغيلي تفاعلي أكثر واقعية وحيوية</small></div><div class="stats"><div class="stat glass"><strong id="workingCount">3</strong><span>يعمل الآن</span></div><div class="stat glass"><strong>4</strong><span>أقسام</span></div><div class="stat glass"><strong>8</strong><span>مهام</span></div></div></div><div class="toolbar glass"><button id="cinematic">سينمائي</button><button id="overview">نظرة عامة</button><button id="walk">جولة</button><button id="reset">إعادة</button></div><aside class="side glass"><div class="eyebrow">AI EMPLOYEE</div><h3 id="empName">فهد</h3><div class="role" id="empRole">AI Product Explorer</div><div class="status"><span class="dot" id="empDot"></span><span id="empStatus">يعمل الآن</span></div><div class="task" id="empTask">استكشاف أفكار منتجات جديدة مبنية على مشاريع نواف.</div><div class="progress"><i id="empProgress"></i></div><div class="actions"><button class="primary" id="focusBtn">تركيز الكاميرا</button><button id="toggleBtn">تبديل الحالة</button></div></aside><div class="hint glass">اسحب لتدوير المشهد • عجلة الماوس للتقريب • اضغط الموظفين أو الأقسام</div><div class="toast glass" id="toast"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js';
const root=document.querySelector('#scene');const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;root.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x05080d,.025);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);let target=new THREE.Vector3(0,1.3,0),yaw=-.72,pitch=.34,distance=17,drag=false,lastX=0,lastY=0,tour=false,tourT=0;camera.position.set(11,7.4,12.4);
scene.add(new THREE.HemisphereLight(0xa7c9ff,0x070707,1.1));const key=new THREE.DirectionalLight(0xffdfa4,3.4);key.position.set(7,11,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);const blue=new THREE.PointLight(0x3c82ff,34,34,2);blue.position.set(-6,5,-4);scene.add(blue);const goldL=new THREE.PointLight(0xf0b856,30,26,2);goldL.position.set(5,4,2);scene.add(goldL);
const mk=(c,r=.5,m=.3,e=0,ei=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:e,emissiveIntensity:ei});const mats={floor:mk(0x090e14,.72,.18),wall:mk(0x0d141d,.52,.28),desk:mk(0x151c25,.4,.52),gold:mk(0xd3a44a,.24,.92,0x402a07,.3),dark:mk(0x0e151e,.44,.34),white:mk(0xdde3e8,.3,.18),screen:mk(0x07131d,.2,.3,0x0f6b9c,1.9),green:mk(0x45d79a,.25,.4,0x45d79a,.8)};mats.glass=new THREE.MeshPhysicalMaterial({color:0x34506a,transparent:true,opacity:.17,roughness:.04,transmission:.55,thickness:.3});const office=new THREE.Group();scene.add(office);function box(w,h,d,mat,x,y,z,cast=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;office.add(o);return o}function cyl(r,h,mat,x,y,z,s=32){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,s),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;office.add(o);return o}
box(16,.45,10,mats.floor,0,-.23,0);box(16,5,.34,mats.wall,0,2.5,-4.86);box(.34,5,10,mats.wall,-7.83,2.5,0);for(let x=-6.5;x<=6.5;x+=2.6){box(2.25,3.25,.05,mats.glass,x,2.4,-4.64,false);box(.035,3.4,.12,mats.gold,x+1.26,2.4,-4.57,false)}for(let z=-3.7;z<=3.7;z+=2.45){box(.05,3.25,2.05,mats.glass,-7.62,2.4,z,false);box(.12,3.4,.035,mats.gold,-7.56,2.4,z+1.16,false)}for(let x=-6.4;x<=6.4;x+=3.2)box(.1,.08,8.7,mats.dark,x,4.85,0,false);for(let x=-5.7;x<=5.7;x+=3.8){const s=box(.045,.025,7.4,mats.gold,x,4.77,0,false);s.material=mk(0xf5cf81,.2,.8,0xf5cf81,2.5)}
function makeDesk(x,z,rot=0){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;const top=new THREE.Mesh(new THREE.BoxGeometry(3,.16,1.12),mats.desk);top.position.y=.76;top.castShadow=true;g.add(top);for(const sx of [-1,1]){const l=new THREE.Mesh(new THREE.BoxGeometry(.12,.72,.12),mats.gold);l.position.set(sx*1.12,.38,0);g.add(l)}const scr=new THREE.Mesh(new THREE.BoxGeometry(1.4,.82,.06),mats.screen);scr.position.set(0,1.35,-.34);scr.rotation.x=-.08;g.add(scr);const kb=new THREE.Mesh(new THREE.BoxGeometry(.72,.03,.24),mats.dark);kb.position.set(0,.87,.18);g.add(kb);office.add(g);return g}
const depts=[{name:'التطوير',x:-4.7,z:-2.25,color:0x4d8dff},{name:'المحتوى',x:4.7,z:-2.25,color:0xa56dff},{name:'التحليل',x:-4.7,z:2.1,color:0x45d79a},{name:'المشاريع',x:4.7,z:2.1,color:0xf0b856}],clickable=[];for(const d of depts){const desk=makeDesk(d.x,d.z,d.x<0?.04:-.04);desk.userData={type:'dept',name:d.name};clickable.push(desk);const ring=new THREE.Mesh(new THREE.RingGeometry(1.55,1.64,64),new THREE.MeshBasicMaterial({color:d.color,transparent:true,opacity:.2,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(d.x,.02,d.z);office.add(ring)}
function plant(x,z){cyl(.18,.38,mats.dark,x,.18,z);const g=new THREE.Group();for(let i=0;i<7;i++){const leaf=new THREE.Mesh(new THREE.ConeGeometry(.11,.85,7),mk(0x173c2b,.75,.05));leaf.position.set(Math.sin(i)*.16,.7,Math.cos(i)*.16);leaf.rotation.z=(i-3)*.13;g.add(leaf)}g.position.set(x,0,z);office.add(g)}plant(-6.5,-3.7);plant(6.5,-3.6);plant(6.5,3.6);box(2.5,.42,.95,mats.dark,-4.9,.22,3.55);box(1,.38,.95,mats.dark,-6.15,.2,3.55);box(1.15,.28,.7,mats.desk,-4.9,.18,2.75);
// central command hub
cyl(2.05,.3,mats.desk,0,.55,0);cyl(1.75,.04,mats.gold,0,.73,0);const holo=new THREE.Mesh(new THREE.SphereGeometry(.65,40,28),mk(0x132945,.16,.72,0x1f67b3,1.4));holo.position.set(0,1.5,0);office.add(holo);const holoRing=new THREE.Mesh(new THREE.TorusGeometry(1.08,.035,14,90),mats.gold);holoRing.rotation.x=Math.PI/2;holoRing.position.set(0,1.48,0);office.add(holoRing);for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const p=new THREE.Mesh(new THREE.SphereGeometry(.055,12,8),mk(0xf5cf81,.2,.5,0xf5cf81,1.8));p.position.set(Math.cos(a)*1.35,1.48,Math.sin(a)*1.35);office.add(p)}
const employees=[{name:'فهد',role:'AI Product Explorer',task:'استكشاف أفكار منتجات جديدة مبنية على مشاريع نواف.',status:'WORKING',progress:62,x:-4.7,z:-2.25},{name:'نورة',role:'AI Operations',task:'مراجعة تقدم المشاريع وتحديد الاختناقات.',status:'WORKING',progress:47,x:4.7,z:-2.25},{name:'سلمان',role:'AI Analyst',task:'تحليل تقارير الأداء وربطها بالمشاريع.',status:'WORKING',progress:78,x:-4.7,z:2.1},{name:'ريم',role:'AI Project Coordinator',task:'جاهزة لاستقبال مهمة جديدة.',status:'READY',progress:0,x:4.7,z:2.1}],agents=[];function makeAgent(e,i){const g=new THREE.Group();g.position.set(e.x,0,e.z+.55);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.24,.46,8,16),mats.white);body.position.y=.72;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.27,24,18),mats.white);head.position.y=1.3;g.add(head);const visor=new THREE.Mesh(new THREE.BoxGeometry(.33,.1,.08),mk(0x061019,.15,.25,e.status==='WORKING'?0x45d79a:0xd3a44a,1.7));visor.position.set(0,1.31,.245);g.add(visor);const ring=new THREE.Mesh(new THREE.TorusGeometry(.38,.022,10,40),mk(e.status==='WORKING'?0x45d79a:0xd3a44a,.2,.4,e.status==='WORKING'?0x45d79a:0xd3a44a,1.4));ring.rotation.x=Math.PI/2;ring.position.y=.15;g.add(ring);g.userData={type:'emp',i};office.add(g);clickable.push(g);agents.push(g);return g}employees.forEach(makeAgent);
// moving service bot
const bot=new THREE.Group();const bbody=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,.28,18),mats.dark);bbody.position.y=.22;bot.add(bbody);const btop=new THREE.Mesh(new THREE.SphereGeometry(.16,16,12),mats.white);btop.position.y=.48;bot.add(btop);const eye=new THREE.Mesh(new THREE.BoxGeometry(.16,.05,.03),mats.screen);eye.position.set(0,.49,.145);bot.add(eye);office.add(bot);
const labels=[];employees.forEach((e,i)=>{const el=document.createElement('div');el.className='label '+(e.status==='WORKING'?'working':'ready');el.textContent=e.name+' • '+(e.status==='WORKING'?'يعمل':'جاهز');document.body.appendChild(el);labels.push(el)});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let selected=0;function updatePanel(){const e=employees[selected];empName.textContent=e.name;empRole.textContent=e.role;empTask.textContent=e.task;empStatus.textContent=e.status==='WORKING'?'يعمل الآن':'جاهز';empDot.style.background=e.status==='WORKING'?'#45d79a':'#d3a44a';empProgress.style.width=e.progress+'%';workingCount.textContent=employees.filter(x=>x.status==='WORKING').length;labels[selected].className='label '+(e.status==='WORKING'?'working':'ready');labels[selected].textContent=e.name+' • '+(e.status==='WORKING'?'يعمل':'جاهز')}updatePanel();function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),1600)}const toastEl=document.querySelector('#toast');
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||tour)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;yaw-=dx*.005;pitch=Math.max(.18,Math.min(.72,pitch+dy*.004));lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('wheel',e=>{if(tour)return;e.preventDefault();distance=Math.max(9,Math.min(26,distance+e.deltaY*.012))},{passive:false});renderer.domElement.addEventListener('click',e=>{const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(clickable,true);if(!hits.length)return;let o=hits[0].object;while(o&&!o.userData?.type)o=o.parent;if(!o)return;if(o.userData.type==='emp'){selected=o.userData.i;updatePanel();toast('تم تحديد '+employees[selected].name)}else toast('قسم '+o.userData.name)});
focusBtn.onclick=()=>{const e=employees[selected];target.set(e.x,1,e.z);distance=9.5;tour=false;toast('تم تركيز الكاميرا')};toggleBtn.onclick=()=>{const e=employees[selected];e.status=e.status==='WORKING'?'READY':'WORKING';e.progress=e.status==='WORKING'?Math.max(18,e.progress):0;updatePanel();toast(e.status==='WORKING'?'بدأ العمل':'أصبح جاهزًا')};overview.onclick=()=>{tour=false;target.set(0,1.15,0);yaw=-.7;pitch=.36;distance=18};cinematic.onclick=()=>{tour=false;target.set(0,1.3,0);yaw=-.95;pitch=.28;distance=15};walk.onclick=()=>{tour=true;tourT=0;toast('بدأت الجولة السينمائية')};reset.onclick=()=>{tour=false;target.set(0,1.3,0);yaw=-.72;pitch=.34;distance=17};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();holo.rotation.y=t*.45;holo.position.y=1.5+Math.sin(t*1.7)*.05;holoRing.rotation.z=t*.25;agents.forEach((a,i)=>{a.position.y=Math.sin(t*1.8+i)*.025;a.children[3].rotation.z=t*.35*(i%2?1:-1)});bot.position.set(Math.sin(t*.35)*5.8,0,3.4+Math.cos(t*.35)*.5);bot.rotation.y=-t*.35;for(let i=0;i<labels.length;i++){const p=agents[i].position.clone().add(new THREE.Vector3(0,1.75,0));p.project(camera);labels[i].style.left=(p.x*.5+.5)*innerWidth+'px';labels[i].style.top=(-p.y*.5+.5)*innerHeight+'px';labels[i].style.display=p.z<1?'block':'none'}if(tour){tourT+=.0025;const a=tourT*Math.PI*2;target.lerp(new THREE.Vector3(0,1.2,0),.03);camera.position.set(Math.cos(a)*14,6.2+Math.sin(a*.5)*1.2,Math.sin(a)*14);camera.lookAt(target)}else{const cp=Math.cos(pitch),sp=Math.sin(pitch);camera.position.set(target.x+Math.cos(yaw)*cp*distance,target.y+sp*distance,target.z+Math.sin(yaw)*cp*distance);camera.lookAt(target)}renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
