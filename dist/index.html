  <div id="app"></div>
  <script src="hq-v5.js"></script>
  <script>
    document.addEventListener('click',function(e){
      const p=e.target.closest('[data-project]');
      if(!p)return;
      const links={mueen:'https://mueen-islamic-app.vercel.app/',qaddha:'https://qaddha.vercel.app/'};
      if(links[p.dataset.project]){e.preventDefault();e.stopImmediatePropagation();location.assign(links[p.dataset.project]);}
    },true);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js" crossorigin="anonymous"></script>
