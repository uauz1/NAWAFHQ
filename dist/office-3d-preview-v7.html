<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAWAF HQ — Living Company V7</title><style>
:root{--bg:#111820;--panel:#16212ddd;--line:#ffffff18;--gold:#ddb45d;--text:#f4f7fa;--muted:#aab5c0;--green:#59dea6;--blue:#7aa7ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e141b;color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}body{background:radial-gradient(circle at 50% 15%,#34465d,#18232e 42%,#0e141b 80%)}#app{position:relative;width:100%;height:100%}#scene{position:absolute;inset:0}.hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:12px}.brand,.modes,.panel,.stats,.hint{background:#101923df;border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 18px 55px #0005}.brand{border-radius:16px;padding:10px 14px}.brand b{color:#f3d690}.brand small{display:block;color:var(--muted);margin-top:3px}.modes{pointer-events:auto;border-radius:14px;padding:6px;display:flex;gap:6px;flex-wrap:wrap}.modes button,.panel button{border:1px solid #ffffff16;background:#1b2733;color:#eef3f7;border-radius:10px;padding:8px 10px;cursor:pointer}.modes button.active,.panel button.primary{background:linear-gradient(#e3b95f,#b38434);color:#111;border-color:#f1d38f}.panel{pointer-events:auto;position:absolute;right:18px;top:92px;width:315px;border-radius:18px;padding:14px}.panel h3{margin:4px 0}.panel .role{color:#f0d18a;font-size:11px}.panel .meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:11px 0}.panel .meta div{background:#1a2530;border:1px solid #ffffff0e;border-radius:10px;padding:8px}.panel .meta span{font-size:9px;color:var(--muted);display:block}.panel .meta b{font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stats{position:absolute;left:15px;top:92px;border-radius:14px;padding:9px 11px;font-size:11px;color:var(--muted)}.stats b{color:#fff;font-size:18px;margin-left:5px}.hint{position:absolute;left:15px;bottom:15px;border-radius:11px;padding:8px 10px;color:var(--muted);font-size:10px}.label{position:absolute;pointer-events:none;transform:translate(-50%,-50%);background:#0c141de8;border:1px solid #ffffff1c;border-radius:9px;padding:5px 8px;font-size:10px;white-space:nowrap}.label b{color:#fff}.label small{display:block;color:#9eabb8}.label.meeting{border-color:#7aa7ff99}.label.working{border-color:#59dea699}@media(max-width:900px){.panel{width:270px;right:8px}.stats{display:none}.brand small{display:none}}
</style></head><body><main id="app"><div id="scene"></div><div class="hud"><div class="top"><div class="brand"><b>NAWAF HQ — LIVING COMPANY</b><small>مقر شركة حي: موظفون، غرف، اجتماعات وحركة فعلية.</small></div><div class="modes"><button data-mode="work" class="active">وضع العمل</button><button data-mode="meeting">اجتماع عند نواف</button><button data-mode="collab">تعاون</button><button data-mode="overview">نظرة عامة</button><button data-mode="nawaf">مكتب نواف</button></div></div><aside class="panel" id="panel"><div class="role">Founder / CEO</div><h3>نواف</h3><p style="font-size:12px;color:#cbd5df">اضغط على موظف أو استخدم أطوار الشركة بالأعلى.</p><div class="actions"><button class="primary" data-act="meeting">استدعاء الجميع</button><button data-act="work">إرجاع للعمل</button></div></aside><div class="stats"><b id="moving">0</b> يتحرك الآن</div><div class="hint">اسحب للدوران • العجلة للتقريب • اضغط على أي موظف</div></div></main><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
(()=>{'use strict';const T=THREE,host=document.getElementById('scene'),panel=document.getElementById('panel');const scene=new T.Scene();scene.background=new T.Color(0x1b2632);scene.fog=new T.FogExp2(0x1b2632,.008);const camera=new T.PerspectiveCamera(39,innerWidth/innerHeight,.1,150);const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=2.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;host.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x56452e,3.9));const sun=new T.DirectionalLight(0xffe4b5,6.2);sun.position.set(10,18,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const front=new T.DirectionalLight(0xbad2ff,3.2);front.position.set(0,9,15);scene.add(front);
const M={floor:new T.MeshStandardMaterial({color:0x303b47,roughness:.55,metalness:.2}),wall:new T.MeshStandardMaterial({color:0x45525f,roughness:.5,metalness:.12}),wood:new T.MeshStandardMaterial({color:0x8b6947,roughness:.42}),gold:new T.MeshStandardMaterial({color:0xd8ac55,metalness:.7,roughness:.2}),glass:new T.MeshPhysicalMaterial({color:0x9ec9e6,transparent:true,opacity:.18,transmission:.58,roughness:.06,side:T.DoubleSide}),screen:new T.MeshStandardMaterial({color:0x0d2232,emissive:0x2c8dcc,emissiveIntensity:2.6,roughness:.15})};function add(g,m,p,x=0,y=0,z=0){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o}function box(p,w,h,d,m,x=0,y=0,z=0){return add(new T.BoxGeometry(w,h,d),m,p,x,y,z)}
box(scene,31,.35,25,M.floor,0,-.18,0);for(let i=-7;i<=7;i++)box(scene,.025,.02,24,new T.MeshBasicMaterial({color:0x52616f,transparent:true,opacity:.35}),i*2,.02,0);for(let i=-5;i<=5;i++)box(scene,30,.02,.025,new T.MeshBasicMaterial({color:0x52616f,transparent:true,opacity:.35}),0,.02,i*2);
const offices=[{id:'fahad',name:'فهد',role:'المنتج والاستراتيجية',x:-8,z:-4.8,color:0xd8ac55},{id:'sara',name:'سارة',role:'العمليات',x:8,z:-4.8,color:0x59dea6},{id:'salman',name:'سلمان',role:'التحليل',x:-8,z:5,color:0x7aa7ff},{id:'noura',name:'نورة',role:'إدارة المشاريع',x:8,z:5,color:0xae80ff}];const agents=new Map(),clickable=[],labels=[];function room(r){const g=new T.Group();g.position.set(r.x,0,r.z);scene.add(g);box(g,6.4,.22,5.5,M.floor,0,.15,0);box(g,6.4,3.5,.16,M.wall,0,1.85,2.66);box(g,.16,3.5,5.5,M.wall,-3.12,1.85,0);box(g,.16,3.5,5.5,M.wall,3.12,1.85,0);box(g,4.1,2.65,.05,M.glass,.75,1.55,-2.66);box(g,1.2,2.25,.07,M.wall,-2.25,1.28,-2.6);box(g,2.9,.14,1.15,M.wood,.35,.82,-.15);[-1,1].forEach(s=>box(g,.09,.72,.09,M.wall,.35+s*1.1,.43,-.15));box(g,1.55,.9,.06,M.screen,.35,1.55,-.68);box(g,.72,.12,.65,M.wall,.35,.44,-1.18);box(g,.72,.92,.12,M.wall,.35,.9,-.88);for(let x=-2;x<=2;x+=2){const l=new T.RectAreaLight?null:null}const warm=new T.PointLight(0xffdfaa,10,9,2);warm.position.set(0,3.1,0);g.add(warm);const acc=new T.PointLight(r.color,4.8,6,2);acc.position.set(0,2.4,-1.5);g.add(acc);const ceiling=box(g,4.4,.05,.12,new T.MeshStandardMaterial({color:0xffe9bd,emissive:0xffe9bd,emissiveIntensity:4}),0,3.3,0);g.userData={type:'room',id:r.id};clickable.push(ceiling);return g}
offices.forEach(room);
const nawaf=new T.Group();nawaf.position.set(0,0,-10);scene.add(nawaf);box(nawaf,11,.26,7.2,new T.MeshStandardMaterial({color:0x4a4034,roughness:.35}),0,.18,0);box(nawaf,11,4,.16,M.wall,0,2,3.48);box(nawaf,.16,4,7.2,M.wall,-5.42,2,0);box(nawaf,.16,4,7.2,M.wall,5.42,2,0);box(nawaf,7.2,3,.05,M.glass,.8,1.75,-3.45);box(nawaf,4.4,.17,1.7,new T.MeshStandardMaterial({color:0x6d4e31,roughness:.28}),0,.9,-.45);box(nawaf,2.0,1.1,.07,M.screen,0,1.72,-1.25);box(nawaf,1.25,.85,.06,M.screen,-2.05,1.58,-1.05);box(nawaf,1.25,.85,.06,M.screen,2.05,1.58,-1.05);box(nawaf,3.3,.48,1.1,new T.MeshStandardMaterial({color:0x4a3728}),-3.5,.3,1.8);box(nawaf,3.3,.48,1.1,new T.MeshStandardMaterial({color:0x4a3728}),3.5,.3,1.8);const nlight=new T.PointLight(0xffd99a,16,14,2);nlight.position.set(0,3.7,0);nawaf.add(nlight);for(let x=-3;x<=3;x+=3)box(nawaf,1.8,.05,.12,new T.MeshStandardMaterial({color:0xffe6b5,emissive:0xffe6b5,emissiveIntensity:5}),x,3.75,0);
const meetingSpots=[new T.Vector3(-2,.12,-8.2),new T.Vector3(-.7,.12,-7.9),new T.Vector3(.7,.12,-7.9),new T.Vector3(2,.12,-8.2)];function person(r,i){const g=new T.Group(),skin=new T.MeshStandardMaterial({color:[0xd9b89c,0xb98d6f,0xc89b80,0xe0baa0][i],roughness:.52}),suit=new T.MeshStandardMaterial({color:[0x314761,0x3b4f43,0x3b4660,0x514261][i],roughness:.34,metalness:.1}),dark=new T.MeshStandardMaterial({color:0x202832,roughness:.3});g.scale.setScalar(1.18);const torso=add(new T.CapsuleGeometry(.28,.72,8,16),suit,g,0,1.22,0);torso.scale.set(1.08,1,.72);add(new T.SphereGeometry(.27,26,20),skin,g,0,1.88,0);const hair=add(new T.SphereGeometry(.278,24,10,0,Math.PI*2,0,Math.PI*.48),dark,g,0,1.94,.01);[-1,1].forEach(s=>{const upper=add(new T.CapsuleGeometry(.075,.50,5,12),suit,g,s*.34,1.26,0);upper.rotation.z=s*.08;const leg=add(new T.CapsuleGeometry(.09,.68,5,12),dark,g,s*.13,.42,0);box(g,.18,.1,.38,dark,s*.13,.08,-.08)});const faceL=box(g,.045,.022,.02,dark,-.09,1.89,-.255),faceR=box(g,.045,.022,.02,dark,.09,1.89,-.255);g.position.set(r.x-.35,.12,r.z-.9);g.userData={type:'employee',id:r.id};g.traverse(o=>{if(o.isMesh){o.userData={type:'employee',id:r.id};clickable.push(o)}});scene.add(g);const home=g.position.clone();agents.set(r.id,{g,home,target:null,path:[],moving:false,index:i,mode:'WORKING'});const el=document.createElement('div');el.className='label working';el.innerHTML='<b>'+r.name+'</b><small>'+r.role+'</small>';document.getElementById('app').appendChild(el);labels.push({el,g,id:r.id});}
offices.forEach(person);
let moving=0,selected='fahad';function setPanel(id){const r=offices.find(x=>x.id===id),a=agents.get(id);if(!r||!a)return;selected=id;panel.innerHTML='<div class="role">'+r.role+'</div><h3>'+r.name+'</h3><div class="meta"><div><span>الحالة</span><b>'+(a.moving?'يتحرك':'في مكتبه')+'</b></div><div><span>الموقع</span><b>'+(a.mode==='MEETING'?'مكتب نواف':'المقر')+'</b></div></div><div class="actions"><button class="primary" data-act="nawaf">إلى نواف</button><button data-act="other">إلى موظف</button><button data-act="home">ارجع للمكتب</button><button data-act="focus">تركيز</button></div>';bindActions()}
function route(from,to){return [from.clone(),new T.Vector3(from.x*.45,.12,from.z*.45),new T.Vector3(to.x*.45,.12,to.z*.45),to.clone()]}
function move(id,target,mode='MOVE'){const a=agents.get(id);if(!a||a.moving)return;a.path=route(a.g.position,target);a.seg=0;a.t=0;a.moving=true;a.mode=mode;moving++;document.getElementById('moving').textContent=moving;setPanel(id)}function home(id){const a=agents.get(id);if(a)move(id,a.home,'WORKING')}function meeting(){offices.forEach((r,i)=>setTimeout(()=>move(r.id,meetingSpots[i],'MEETING'),i*220));setMode('meeting')}function work(){agents.forEach((a,id)=>{if(!a.moving)home(id)});setMode('work')}function collaborate(){move('sara',agents.get('fahad').home.clone().add(new T.Vector3(1.1,0,.4)),'COLLAB');move('salman',agents.get('noura').home.clone().add(new T.Vector3(-1.1,0,.4)),'COLLAB');setMode('collab')}
function bindActions(){panel.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='nawaf')move(selected,meetingSpots[offices.findIndex(x=>x.id===selected)],'MEETING');if(a==='home')home(selected);if(a==='other'){const other=offices.find(x=>x.id!==selected);move(selected,agents.get(other.id).home.clone().add(new T.Vector3(1,0,.3)),'COLLAB')}if(a==='focus'){const ag=agents.get(selected);desired.target=ag.g.position.clone().setY(1.2);desired.distance=6}})}
panel.addEventListener('click',e=>{if(e.target.dataset.act==='meeting')meeting();if(e.target.dataset.act==='work')work()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const m=b.dataset.mode;if(m==='meeting')meeting();else if(m==='work')work();else if(m==='collab')collaborate();else setMode(m)});function setMode(m){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));if(m==='overview'){desired.target.set(0,1,0);desired.distance=30;desired.pitch=.58}if(m==='nawaf'){desired.target.set(0,1.4,-10);desired.distance=10;desired.pitch=.24}if(m==='work'){desired.target.set(0,1,-1);desired.distance=26;desired.pitch=.4}}
function tick(dt,now){agents.forEach(a=>{if(!a.moving)return;const p0=a.path[a.seg],p1=a.path[a.seg+1],d=p0.distanceTo(p1);a.t+=dt*3.0/Math.max(.1,d);const t=Math.min(1,a.t),p=p0.clone().lerp(p1,t);a.g.position.copy(p);a.g.rotation.y=Math.atan2(p1.x-p0.x,p1.z-p0.z);a.g.position.y=.12+Math.abs(Math.sin(now*.012))*0.05;a.g.children.forEach((o,j)=>{if(j>1)o.rotation.x=Math.sin(now*.015+j)*.10});if(t>=1){a.seg++;a.t=0;if(a.seg>=a.path.length-1){a.moving=false;moving=Math.max(0,moving-1);document.getElementById('moving').textContent=moving;if(a.mode==='MEETING')a.g.rotation.y=Math.PI;setPanel(a.g.userData.id)}}})}
const ray=new T.Raycaster(),mouse=new T.Vector2();let desired={target:new T.Vector3(0,1,-1),yaw:.72,pitch:.4,distance:26},cur={target:desired.target.clone(),yaw:.72,pitch:.4,distance:26},drag=false,lx=0,ly=0;renderer.domElement.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!drag)return;desired.yaw+=(e.clientX-lx)*.006;desired.pitch=Math.max(.15,Math.min(1.15,desired.pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY};renderer.domElement.onpointerup=e=>{drag=false;const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(clickable,true)[0]?.object;if(h?.userData?.type==='employee')setPanel(h.userData.id)};renderer.domElement.onwheel=e=>{e.preventDefault();desired.distance=Math.max(6,Math.min(38,desired.distance+e.deltaY*.012))};
function cam(){cur.target.lerp(desired.target,.08);cur.yaw+=(desired.yaw-cur.yaw)*.08;cur.pitch+=(desired.pitch-cur.pitch)*.08;cur.distance+=(desired.distance-cur.distance)*.08;camera.position.set(cur.target.x+Math.sin(cur.yaw)*Math.cos(cur.pitch)*cur.distance,cur.target.y+Math.sin(cur.pitch)*cur.distance,cur.target.z+Math.cos(cur.yaw)*Math.cos(cur.pitch)*cur.distance);camera.lookAt(cur.target)}let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/1000);last=now;tick(dt,now);cam();labels.forEach(l=>{const p=l.g.position.clone();p.y=2.9;p.project(camera);l.el.style.left=(p.x*.5+.5)*innerWidth+'px';l.el.style.top=(-p.y*.5+.5)*innerHeight+'px';const a=agents.get(l.id);l.el.className='label '+(a.mode==='MEETING'?'meeting':'working')});renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setPanel('fahad');animate(performance.now());window.NawafOfficeV7={meeting,work,collaborate,moveEmployee:move,returnHome:home};})();
</script></body></html>
