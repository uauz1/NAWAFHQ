<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAWAF HQ — Living Office V10</title><style>:root{--gold:#d7ab58;--bg:#0d1117;--panel:#101720e8;--line:#ffffff18;--text:#f4f1ea;--muted:#a8b0b9}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1016;color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif}#app,#scene{position:absolute;inset:0}.hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:12px}.brand,.modes,.panel,.ticker,.hint{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 18px 55px #0006}.brand{padding:10px 14px;border-radius:16px}.brand b{color:#f0d08d}.brand small{display:block;color:var(--muted);margin-top:3px}.modes{pointer-events:auto;padding:6px;border-radius:14px;display:flex;gap:6px;flex-wrap:wrap}.modes button,.panel button{border:1px solid #ffffff16;background:#18212b;color:#f1f4f6;border-radius:10px;padding:8px 10px;cursor:pointer}.modes button.active,.panel button.primary{background:linear-gradient(#e1b75f,#a97b31);color:#111}.panel{pointer-events:auto;position:absolute;right:18px;top:90px;width:320px;border-radius:18px;padding:14px}.panel h3{margin:4px 0}.role{color:#efcf88;font-size:11px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:11px 0}.meta div{background:#151f29;border:1px solid #ffffff0e;border-radius:10px;padding:8px}.meta span{font-size:9px;color:var(--muted);display:block}.meta b{font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions .wide{grid-column:1/-1}.ticker{position:absolute;left:15px;bottom:48px;padding:8px 10px;border-radius:11px;color:#d5dde5;font-size:10px}.hint{position:absolute;left:15px;bottom:14px;padding:8px 10px;border-radius:11px;color:var(--muted);font-size:10px}.label{position:absolute;pointer-events:none;transform:translate(-50%,-50%);background:#0b1219e8;border:1px solid #ffffff1b;border-radius:9px;padding:5px 8px;font-size:10px;white-space:nowrap}.label small{display:block;color:#9aa6b2}@media(max-width:900px){.panel{width:270px;right:8px}.brand small{display:none}}</style></head><body><main id="app"><div id="scene"></div><div class="hud"><div class="top"><div class="brand"><b>NAWAF HQ — V10</b><small>مقر تنفيذي داكن بخامات خشب، فحمي، زجاج ونحاس — كل مكتب له شخصية وسلوك مختلف.</small></div><div class="modes"><button class="active" data-mode="work">العمل</button><button data-mode="meeting">اجتماع عند نواف</button><button data-mode="review">مراجعة</button><button data-mode="collab">تعاون</button><button data-mode="nawaf">مكتب نواف</button></div></div><aside class="panel" id="panel"></aside><div class="ticker" id="ticker">المقر يعمل.</div><div class="hint">اسحب للدوران • العجلة للتقريب • اضغط موظفًا أو شاشة</div></div></main><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>(()=>{'use strict';const T=THREE,host=document.getElementById('scene'),panel=document.getElementById('panel'),ticker=document.getElementById('ticker');const scene=new T.Scene();scene.background=new T.Color(0x111821);scene.fog=new T.FogExp2(0x111821,.006);const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,180),renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.95;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;host.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xe9eef5,0x2a2119,3.8));const sun=new T.DirectionalLight(0xffdfad,5.8);sun.position.set(11,18,10);sun.castShadow=true;scene.add(sun);const fill=new T.DirectionalLight(0x8db6ff,2.4);fill.position.set(-10,8,12);scene.add(fill);const defs=[{id:'fahad',name:'فهد',role:'المنتج والاستراتيجية',x:-8,z:-4.8,color:0xd5aa55,activity:'يعمل على أفكار المنتج ولوحة المفاهيم'},{id:'sara',name:'سارة',role:'العمليات',x:8,z:-4.8,color:0x58d49f,activity:'تراجع سير العمل والملفات التشغيلية'},{id:'salman',name:'سلمان',role:'التحليل',x:-8,z:5.2,color:0x739dff,activity:'يراجع تقارير وأوراق تحليل'},{id:'noura',name:'نورة',role:'إدارة المشاريع',x:8,z:5.2,color:0xae7cff,activity:'تحدث خارطة الطريق وبطاقات المشروع'}];const M={floor:new T.MeshStandardMaterial({color:0x29323b,roughness:.48,metalness:.08}),wall:new T.MeshStandardMaterial({color:0x343f49,roughness:.5}),walnut:new T.MeshStandardMaterial({color:0x5a3d28,roughness:.34}),oak:new T.MeshStandardMaterial({color:0x7d5a38,roughness:.38}),black:new T.MeshStandardMaterial({color:0x171d24,roughness:.28,metalness:.22}),brass:new T.MeshStandardMaterial({color:0xc69a4d,roughness:.22,metalness:.72}),glass:new T.MeshPhysicalMaterial({color:0x7ea1b4,transparent:true,opacity:.18,transmission:.6,roughness:.06,side:T.DoubleSide}),paper:new T.MeshStandardMaterial({color:0xd9d1c3,roughness:.85}),green:new T.MeshStandardMaterial({color:0x315e49,roughness:.72})};function add(g,m,p,x=0,y=0,z=0){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o}function box(p,w,h,d,m,x=0,y=0,z=0){return add(new T.BoxGeometry(w,h,d),m,p,x,y,z)}const clickable=[],agents=new Map(),labels=[];box(scene,34,.35,29,M.floor,0,-.18,0);for(let i=-8;i<=8;i++)box(scene,.018,.014,27,new T.MeshBasicMaterial({color:0x5f6f7e,transparent:true,opacity:.13}),i*2,.02,0);function lightBar(p,x,z,w=2){return box(p,w,.05,.12,new T.MeshStandardMaterial({color:0xffdca3,emissive:0xffdca3,emissiveIntensity:3.8}),x,3.45,z)}function plant(p,x,z){add(new T.CylinderGeometry(.22,.18,.38,16),M.black,p,x,.2,z);for(let i=0;i<7;i++){const l=add(new T.ConeGeometry(.12,.68,7),M.green,p,x+Math.sin(i)*.16,.72,z+Math.cos(i)*.16);l.rotation.z=(i-3)*.12}}function shelf(p,x,z){box(p,1.4,1.8,.32,M.black,x,1.02,z);for(let y=.4;y<1.7;y+=.43)box(p,1.28,.035,.28,M.brass,x,y,z-.01)}function chair(p,x,z,lux=false){const g=new T.Group();g.position.set(x,.1,z);const m=lux?new T.MeshStandardMaterial({color:0x2a201a,roughness:.25}):M.black;box(g,lux?1:.72,.14,lux?.8:.62,m,0,.43,0);box(g,lux?1:.72,lux?1.18:.9,.13,m,0,lux?1:.9,.28);box(g,.08,.4,.08,M.brass,0,.2,0);p.add(g);return g}function screen(p,w,h,x,y,z,color,data,ry=0){const s=box(p,w,h,.06,new T.MeshStandardMaterial({color:0x0c1620,emissive:color,emissiveIntensity:2.3,roughness:.12}),x,y,z);s.rotation.y=ry;s.userData={type:'screen',...data};clickable.push(s);return s}function keyboard(p,x,z){const g=new T.Group();g.position.set(x,.98,z);box(g,.72,.04,.27,M.black);for(let r=0;r<3;r++)for(let c=0;c<8;c++)box(g,.06,.014,.04,M.wall,-.25+c*.073,.032,-.07+r*.07);p.add(g);return g}function papers(p,x,z){const g=new T.Group();g.position.set(x,.98,z);for(let i=0;i<6;i++){const pg=box(g,.52,.01,.34,M.paper,(i%2)*.025,i*.015,(i%3)*.012);pg.rotation.y=(i-2)*.02}p.add(g);return g}function pinboard(p,x,y,z){box(p,1.9,1.15,.07,new T.MeshStandardMaterial({color:0x3a2b22,roughness:.65}),x,y,z);for(let i=0;i<9;i++)box(p,.34,.22,.025,new T.MeshStandardMaterial({color:[0xc8a75f,0x6e9b88,0x708bb9][i%3],roughness:.62}),x-.58+(i%3)*.58,y+.3-Math.floor(i/3)*.34,z-.05)}function room(r,i){const g=new T.Group();g.position.set(r.x,0,r.z);scene.add(g);box(g,6.7,.22,5.8,M.floor,0,.15,0);box(g,6.7,3.75,.16,M.wall,0,1.98,2.8);box(g,.16,3.75,5.8,M.wall,-3.25,1.98,0);box(g,.16,3.75,5.8,M.wall,3.25,1.98,0);box(g,4.2,2.85,.05,M.glass,.8,1.7,-2.8);box(g,1.25,2.35,.07,M.black,-2.35,1.32,-2.73);box(g,3.2,.16,1.28,i%2?M.oak:M.walnut,.3,.88,-.05);[-1,1].forEach(s=>box(g,.09,.76,.09,M.brass,.3+s*1.2,.47,-.05));chair(g,.3,-1.2);plant(g,2.45,1.65);shelf(g,-2.25,1.65);const warm=new T.PointLight(0xffdcb0,8.5,9,2);warm.position.set(0,3.15,0);g.add(warm);const acc=new T.PointLight(r.color,3.1,6,2);acc.position.set(0,2.3,-1.3);g.add(acc);lightBar(g,0,0,1.8);if(i===0){screen(g,1.7,.95,.3,1.65,-.7,r.color,{employeeId:r.id,title:'لوحة المنتج'});keyboard(g,.3,-.1);pinboard(g,1.75,1.9,2.72);box(g,.6,.08,.38,M.black,-1.05,.98,.1)}if(i===1){screen(g,1.12,.72,-.35,1.58,-.68,r.color,{employeeId:r.id,title:'العمليات'},.12);screen(g,1.12,.72,1.0,1.58,-.68,r.color,{employeeId:r.id,title:'سير العمل'},-.12);papers(g,-1.25,.2);box(g,.8,.07,.46,M.black,1.45,.98,.25)}if(i===2){screen(g,1.45,.84,.1,1.6,-.69,r.color,{employeeId:r.id,title:'التحليل'});papers(g,1.2,.22);papers(g,1.7,.5);box(g,1.2,.04,.5,M.black,-1.15,.96,.18)}if(i===3){screen(g,1.4,.82,.15,1.6,-.69,r.color,{employeeId:r.id,title:'خارطة الطريق'});pinboard(g,1.85,1.92,2.72);box(g,1.15,.05,.55,M.black,-1.15,.96,.18)}}defs.forEach(room);const nawaf=new T.Group();nawaf.position.set(0,0,-10.8);scene.add(nawaf);box(nawaf,12.6,.28,8.3,new T.MeshStandardMaterial({color:0x30271f,roughness:.3}),0,.18,0);box(nawaf,12.6,4.35,.16,new T.MeshStandardMaterial({color:0x27313b,roughness:.4}),0,2.18,4.02);box(nawaf,.16,4.35,8.3,M.wall,-6.2,2.18,0);box(nawaf,.16,4.35,8.3,M.wall,6.2,2.18,0);box(nawaf,8.2,3.35,.05,M.glass,.9,1.92,-4);box(nawaf,5.3,.2,1.95,M.walnut,0,.98,-.45);box(nawaf,.12,.82,.12,M.brass,-2.1,.5,-.45);box(nawaf,.12,.82,.12,M.brass,2.1,.5,-.45);screen(nawaf,2.35,1.25,0,1.9,-1.34,0xd7ab58,{title:'لوحة القيادة'});screen(nawaf,1.25,.88,-2.2,1.7,-1.1,0x739dff,{title:'المشاريع'});screen(nawaf,1.25,.88,2.2,1.7,-1.1,0x58d49f,{title:'الفريق'});chair(nawaf,0,-2,true);plant(nawaf,-5.1,2.7);plant(nawaf,5.1,2.7);shelf(nawaf,-4.7,-1.1);shelf(nawaf,4.7,-1.1);box(nawaf,4.5,.18,1.45,M.oak,0,.72,2.1);[-1.6,0,1.6].forEach(x=>chair(nawaf,x,2.95,false));for(let x=-3.2;x<=3.2;x+=3.2)lightBar(nawaf,x,0,2);const nl=new T.PointLight(0xffd499,12,14,2);nl.position.set(0,3.8,0);nawaf.add(nl);function buildPerson(r,i,nawafPerson=false){const g=new T.Group(),skins=[0xd6b295,0xb9896c,0xca9a7c,0xe0b89c,0xc79a7c],suits=[0x2d4055,0x384a40,0x34405a,0x4d3d58,0x1f2630],skin=new T.MeshStandardMaterial({color:skins[i%skins.length],roughness:.5}),suit=new T.MeshStandardMaterial({color:suits[i%suits.length],roughness:.3}),pants=M.black,hair=new T.MeshStandardMaterial({color:0x171311,roughness:.55});g.scale.setScalar(nawafPerson?1.45:1.28);const torso=add(new T.CapsuleGeometry(.28,.76,8,18),suit,g,0,1.27,0);torso.scale.set(1.08,1,.72);add(new T.SphereGeometry(.27,28,22),skin,g,0,1.94,0);add(new T.SphereGeometry(.278,24,10,0,Math.PI*2,0,Math.PI*.48),hair,g,0,2,.01);const limbs=[];[-1,1].forEach(s=>{const arm=add(new T.CapsuleGeometry(.075,.52,5,12),suit,g,s*.34,1.29,0);arm.rotation.z=s*.08;limbs.push(arm);add(new T.CapsuleGeometry(.09,.7,5,12),pants,g,s*.13,.43,0);box(g,.18,.1,.38,pants,s*.13,.08,-.08)});g.userData={type:'employee',id:r.id};g.traverse(o=>{if(o.isMesh){o.userData={type:'employee',id:r.id};clickable.push(o)}});scene.add(g);return {g,arms:limbs,home:g.position.clone()}}defs.forEach((r,i)=>{const p=buildPerson(r,i,false);p.g.position.set(r.x-.2,.12,r.z-.95);p.home=p.g.position.clone();agents.set(r.id,{...p,mode:'WORK',moving:false,path:[],index:i});const el=document.createElement('div');el.className='label';el.innerHTML='<b>'+r.name+'</b><small>'+r.role+'</small>';document.getElementById('app').appendChild(el);labels.push({el,g:p.g})});const np=buildPerson({id:'nawaf'},4,true);np.g.position.set(0,.12,-12.2);np.g.rotation.y=Math.PI;const meeting=[new T.Vector3(-2,.12,-8.8),new T.Vector3(-.7,.12,-8.45),new T.Vector3(.7,.12,-8.45),new T.Vector3(2,.12,-8.8)],review=[new T.Vector3(-1.8,.12,-.8),new T.Vector3(-.6,.12,-.8),new T.Vector3(.6,.12,-.8),new T.Vector3(1.8,.12,-.8)];let selected=defs[0].id,moving=0;function activityText(a){return a.mode==='MEETING'?'في اجتماع':a.mode==='REVIEW'?'يراجع مشروعًا':a.mode==='COLLAB'?'يتعاون مع موظف':'يعمل داخل مكتبه'}function setPanel(id){if(id==='nawaf'){panel.innerHTML='<div class="role">Founder / CEO</div><h3>نواف</h3><div class="meta"><div><span>الموقع</span><b>المكتب التنفيذي</b></div><div><span>الحالة</span><b>متاح للقيادة</b></div></div><div class="actions"><button class="primary wide" data-act="meeting-all">استدعاء الجميع</button></div>';bind();return}const r=defs.find(x=>x.id===id),a=agents.get(id);selected=id;panel.innerHTML='<div class="role">'+r.role+'</div><h3>'+r.name+'</h3><div class="meta"><div><span>السلوك</span><b>'+r.activity+'</b></div><div><span>الحالة</span><b>'+activityText(a)+'</b></div></div><div class="actions"><button class="primary" data-act="nawaf">إلى نواف</button><button data-act="other">تعاون</button><button data-act="home">ارجع للمكتب</button><button data-act="focus">تركيز</button></div>';bind()}function route(f,t){return[f.clone(),new T.Vector3(f.x,.12,-.8),new T.Vector3(t.x,.12,-.8),t.clone()]}function move(id,to,mode){const a=agents.get(id);if(!a)return;a.path=route(a.g.position,to);a.seg=0;a.t=0;a.moving=true;a.mode=mode;moving++;ticker.textContent=defs.find(x=>x.id===id).name+' يتحرك داخل المقر.'}function home(id){const a=agents.get(id);move(id,a.home,'WORK')}function meetingAll(){defs.forEach((r,i)=>setTimeout(()=>move(r.id,meeting[i],'MEETING'),i*180));ticker.textContent='اجتماع تنفيذي عند نواف.'}function reviewAll(){defs.forEach((r,i)=>setTimeout(()=>move(r.id,review[i],'REVIEW'),i*160));ticker.textContent='جلسة مراجعة مشروع.'}function collab(){move('sara',agents.get('fahad').g.position.clone().add(new T.Vector3(1,0,.5)),'COLLAB');move('salman',agents.get('noura').g.position.clone().add(new T.Vector3(-1,0,.5)),'COLLAB')}function bind(){panel.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const x=b.dataset.act;if(x==='meeting-all')meetingAll();if(x==='nawaf')move(selected,meeting[defs.findIndex(r=>r.id===selected)],'MEETING');if(x==='home')home(selected);if(x==='other'){const o=defs.find(r=>r.id!==selected);move(selected,agents.get(o.id).g.position.clone().add(new T.Vector3(1,0,.5)),'COLLAB')}if(x==='focus'){target.copy(agents.get(selected).g.position);distance=6.3}})}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));const m=b.dataset.mode;if(m==='work')defs.forEach((r,i)=>setTimeout(()=>home(r.id),i*120));if(m==='meeting')meetingAll();if(m==='review')reviewAll();if(m==='collab')collab();if(m==='nawaf'){target.set(0,1.4,-10.7);distance=9}});let target=new T.Vector3(0,1.1,-1),yaw=.68,pitch=.48,distance=28,drag=false,lx=0,ly=0;const canvas=renderer.domElement,ray=new T.Raycaster(),mouse=new T.Vector2();canvas.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-lx)*.005;pitch=Math.max(.12,Math.min(1.18,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY};canvas.onpointerup=e=>{drag=false;const r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-((e.clientY-r.top)/r.height*2-1);ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(clickable,true)[0]?.object;if(h?.userData?.type==='employee')setPanel(h.userData.id);if(h?.userData?.type==='screen')window.dispatchEvent(new CustomEvent('hq:screen-selected',{detail:h.userData}))};canvas.onwheel=e=>distance=Math.max(6,Math.min(38,distance+e.deltaY*.012));function tick(dt,time){agents.forEach((a,id)=>{if(a.moving){const p0=a.path[a.seg],p1=a.path[a.seg+1],d=Math.max(.01,p0.distanceTo(p1));a.t+=dt*2.5/d;const t=Math.min(1,a.t);a.g.position.lerpVectors(p0,p1,t);a.g.rotation.y=Math.atan2(p1.x-p0.x,p1.z-p0.z);a.arms[0].rotation.x=Math.sin(time*.01)*.55;a.arms[1].rotation.x=-Math.sin(time*.01)*.55;if(t>=1){a.seg++;a.t=0;if(a.seg>=a.path.length-1){a.moving=false;moving=Math.max(0,moving-1)}}}else if(a.mode==='WORK'){if(a.index===0){a.arms[0].rotation.x=-.9+Math.sin(time*.012)*.12;a.arms[1].rotation.x=-.9-Math.sin(time*.012)*.12}else if(a.index===1){a.arms[0].rotation.y=Math.sin(time*.003)*.25;a.g.rotation.y=Math.sin(time*.0015)*.08}else if(a.index===2){a.arms[0].rotation.x=-.5+Math.sin(time*.004)*.25;a.g.rotation.y=Math.sin(time*.0012)*.06}else{a.arms[1].rotation.z=.3+Math.sin(time*.005)*.18;a.g.rotation.y=-.08+Math.sin(time*.0014)*.05}}})}function labelsTick(){labels.forEach(l=>{const v=l.g.position.clone();v.y+=2.8;v.project(camera);l.el.style.left=((v.x*.5+.5)*innerWidth)+'px';l.el.style.top=((-v.y*.5+.5)*innerHeight)+'px';l.el.style.display=v.z<1?'block':'none'})}let last=performance.now();function anim(now){requestAnimationFrame(anim);const dt=Math.min(.04,(now-last)/1000);last=now;tick(dt,now);const cp=new T.Vector3(target.x+Math.sin(yaw)*Math.cos(pitch)*distance,target.y+Math.sin(pitch)*distance,target.z+Math.cos(yaw)*Math.cos(pitch)*distance);camera.position.lerp(cp,.08);camera.lookAt(target);labelsTick();renderer.render(scene,camera)}window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};setPanel('fahad');anim(performance.now());window.NawafOfficeV10={meetingAll,reviewAll,collab,sendToNawaf:id=>move(id,meeting[defs.findIndex(r=>r.id===id)],'MEETING'),returnHome:home};})();</script></body></html>
