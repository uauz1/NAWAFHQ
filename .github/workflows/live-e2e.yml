name: Live E2E
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'api/**'
      - 'render-server-v2.mjs'
      - 'project-executor.mjs'
      - 'state-cloud.mjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/live-e2e.yml'
permissions:
  contents: read
jobs:
  live-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run smoke checks
        run: npm test
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for Render deployment
        run: sleep 45
      - name: Run live browser test
        env:
          HQ_URL: https://nawaf-hq-main.onrender.com
        run: |
          set -o pipefail
          node tests/e2e-live.mjs 2>&1 | tee live-e2e.log
      - name: Upload live E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-diagnostics-${{ github.run_id }}
          path: live-e2e.log
          if-no-files-found: warn
          retention-days: 3
