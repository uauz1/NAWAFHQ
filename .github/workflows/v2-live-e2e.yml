name: NAWAF HQ V2 Live E2E

on:
  workflow_dispatch:
  push:
    branches: [v2-production]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-live-e2e.yml'
      - 'package*.json'

permissions:
  contents: read

jobs:
  live-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify V2 locally
        run: npm ci && npm run v2:check
      - name: Install Playwright Chromium
        run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Wait for V2 deployment
        run: sleep 45
      - name: Test deployed V2
        env:
          HQ_V2_URL: https://nawaf-hq-v2.onrender.com
        run: node v2/tests/live-e2e.mjs
